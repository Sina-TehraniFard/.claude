<style>
  :root {
    --bg: #f5f7fa;
    --sidebar-bg: #ffffff;
    --card: #ffffff;
    --hover: #f1f5f9;
    --accent: #4f46e5;
    --accent-soft: #4f46e514;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.05);
    --ok: #16a34a;
    --warn: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ===== サイドバー目次 ===== */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    padding: 24px 14px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    transition: width .25s ease, padding .25s ease, opacity .2s ease;
  }
  /* 閉じた状態：幅0にして中身を隠す */
  body.sidebar-collapsed .sidebar {
    width: 0;
    padding-left: 0;
    padding-right: 0;
    border-right: none;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* ===== 開閉トグルボタン（サイドバー右側面のタブ） ===== */
  .toggle-btn {
    position: fixed;
    top: 50%;
    /* サイドバーの幅(300px)の右端に貼り付く。開いている間はここ */
    left: 300px;
    transform: translateY(-50%);
    z-index: 100;
    width: 22px;
    height: 56px;
    border: none;
    border-radius: 0 8px 8px 0;
    background: var(--sidebar-bg);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 2px 0 8px rgba(15,23,42,.08);
    transition: left .25s ease, background .15s, color .15s;
  }
  .toggle-btn:hover { background: var(--hover); color: var(--accent); }
  /* 閉じている時はサイドバー幅0なので、左端に貼り付く */
  body.sidebar-collapsed .toggle-btn { left: 0; }
  .sidebar h2 {
    font-size: 12px;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 12px;
  }
  .toc { list-style: none; flex: 1; }
  .toc li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    margin-bottom: 2px;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  .toc li:hover { background: var(--hover); }
  .toc li:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .toc li.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .toggle-btn:focus-visible, .connect-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ===== キー操作ヒント ===== */
  .kbd-hint {
    position: fixed;
    bottom: 16px; right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: var(--shadow);
  }
  .kbd-hint kbd {
    font-family: inherit;
    font-size: 11px;
    background: var(--hover);
    color: var(--text);
    border-radius: 4px;
    padding: 2px 6px;
    min-width: 18px;
    text-align: center;
  }
  .handle {
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: grab;
    flex-shrink: 0;
  }
  .handle:active { cursor: grabbing; }
  .num {
    width: 22px; height: 22px;
    flex-shrink: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .label { font-size: 14px; }

  /* SortableJS のドラッグ中スタイル */
  .sortable-ghost { opacity: .5; background: var(--accent-soft); border-style: dashed; }
  .sortable-chosen { border-color: var(--accent); }
  .sortable-drag { background: var(--card); box-shadow: 0 12px 32px rgba(15,23,42,.18); }

  /* ===== 保存コントロール ===== */
  .save-box {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .connect-btn {
    width: 100%;
    padding: 11px;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--accent-soft);
  }
  .connect-btn:hover { filter: brightness(1.08); }
  .status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    line-height: 1.5;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }

  /* ===== メイン（スライド表示エリア） ===== */
  .main { flex: 1; display: grid; place-items: center; padding: 40px 40px 40px 48px; }
  .slide { text-align: center; max-width: 720px; }
  .slide .big-num { font-size: 88px; font-weight: 800; color: var(--accent); line-height: 1; }
  .slide h1 { font-size: 36px; margin: 16px 0; }
  .slide p { color: var(--muted); font-size: 16px; line-height: 1.7; white-space: pre-wrap; }
  .browser-warn {
    position: fixed;
    top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--warn);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: none;
  }
</style>
</head>
<body>

  <div class="browser-warn" id="browserWarn">
    ⚠ このブラウザは自動保存に未対応です。Chrome または Edge で開いてください。
  </div>

  <button class="toggle-btn" id="toggleBtn" title="目次の開閉（Space）" aria-label="目次の開閉">‹</button>

  <aside class="sidebar">
    <h2>目次</h2>
    <ul class="toc" id="toc">
      <!--
        スライド1枚 = <li> 1つ。属性の意味:
          data-id    : 各スライドを一意に識別（順序保存に使用。重複しない英数字）
          data-title : メイン領域に表示する見出し
          data-body  : 本文（改行は実際の改行文字でOK。white-space:pre-wrap で反映）
          class="active" : 最初に表示するスライドに付ける（1枚だけ）
        ↓ ここを実際の内容に置き換える。枚数は自由に増減してよい。
      -->
      <li data-id="s1" data-title="{{スライド1の見出し}}" data-body="{{スライド1の本文}}" class="active"><span class="handle">⠿</span><span class="num">1</span><span class="label">{{スライド1のタイトル}}</span></li>
      <li data-id="s2" data-title="{{スライド2の見出し}}" data-body="{{スライド2の本文}}"><span class="handle">⠿</span><span class="num">2</span><span class="label">{{スライド2のタイトル}}</span></li>
      <li data-id="s3" data-title="{{スライド3の見出し}}" data-body="{{スライド3の本文}}"><span class="handle">⠿</span><span class="num">3</span><span class="label">{{スライド3のタイトル}}</span></li>
    </ul>

    <div class="save-box">
      <button class="connect-btn" id="connectBtn">📁 このファイルに接続して自動保存</button>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">未接続：ボタンを押してこのHTMLファイルを選んでください</span></div>
    </div>
  </aside>

  <main class="main">
    <!-- 表示中スライドの中身（JS が data-* から流し込む） -->
    <div class="slide" id="slide">
      <div class="big-num">1</div>
      <h1>{{スライド1の見出し}}</h1>
      <p>{{スライド1の本文}}</p>
    </div>
  </main>

  <div class="kbd-hint">
    <kbd>←</kbd><kbd>→</kbd> スライド移動 ・ <kbd>Space</kbd> 目次開閉
  </div>

<script>
  const toc = document.getElementById("toc");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const connectBtn = document.getElementById("connectBtn");

  let fileHandle = null;            // 接続済みのファイルハンドル
  const supported = "showOpenFilePicker" in window;

  if (!supported) {
    document.getElementById("browserWarn").style.display = "block";
    connectBtn.disabled = true;
    connectBtn.textContent = "⚠ 自動保存はChrome/Edgeのみ対応";
  }

  // ---- 番号を振り直す ----
  function renumber() {
    [...toc.children].forEach((li, i) => {
      li.querySelector(".num").textContent = i + 1;
    });
  }

  // ---- スライド表示 ----
  function showSlide(li, { scroll = true } = {}) {
    if (!li) return;
    toc.querySelectorAll("li").forEach(el => el.classList.remove("active"));
    li.classList.add("active");
    const idx = [...toc.children].indexOf(li) + 1;
    const slide = document.getElementById("slide");
    slide.querySelector(".big-num").textContent = idx;
    slide.querySelector("h1").textContent = li.dataset.title;
    slide.querySelector("p").textContent = li.dataset.body;
    if (scroll) li.scrollIntoView({ block: "nearest" });
  }

  // ---- 隣のスライドへ移動（キー操作用） ----
  function move(delta) {
    const items = [...toc.children];
    const cur = toc.querySelector("li.active") || items[0];
    let i = items.indexOf(cur) + delta;
    i = Math.max(0, Math.min(items.length - 1, i));  // 端で止める
    showSlide(items[i]);
  }
  function goEdge(toLast) {
    const items = [...toc.children];
    showSlide(items[toLast ? items.length - 1 : 0]);
  }

  // ---- 状態表示の更新 ----
  function setStatus(state, msg) {
    dot.className = "dot" + (state ? " " + state : "");
    statusText.textContent = msg;
  }

  /**
   * 現在のDOM（並べ替え後）を丸ごとHTML文字列にして返す。
   * これをファイルに書き戻すことで「並び順が反映されたHTML」になる。
   */
  function buildHtmlSnapshot() {
    const clone = document.documentElement.cloneNode(true);
    // browser-warn は保存時に消えた状態で固定（開いた人の環境で再判定される）
    const warn = clone.querySelector("#browserWarn");
    if (warn) warn.style.display = "none";
    // サイドバーの開閉状態は保存しない（常に開いた状態で保存）
    const body = clone.querySelector("body");
    if (body) body.classList.remove("sidebar-collapsed");
    // 接続UIは初期状態に戻して保存（受け取った人は「未接続」から始める）
    const btn = clone.querySelector("#connectBtn");
    if (btn) {
      btn.textContent = "📁 このファイルに接続して自動保存";
      btn.removeAttribute("data-reconnect");
    }
    const d = clone.querySelector("#dot");
    if (d) d.className = "dot";
    const st = clone.querySelector("#statusText");
    if (st) st.textContent = "未接続：ボタンを押してこのHTMLファイルを選んでください";
    return "<!DOCTYPE html>\n" + clone.outerHTML;
  }

  // ---- ファイルに書き込む ----
  async function writeToFile() {
    if (!fileHandle) return;
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(buildHtmlSnapshot());
      await writable.close();
      const t = new Date().toLocaleTimeString("ja-JP");
      setStatus("ok", `保存済み（${t}）：以降ドラッグするたび自動保存されます`);
    } catch (e) {
      setStatus("warn", "保存に失敗しました: " + e.message);
    }
  }

  // ===== ファイルハンドルを IndexedDB に保存／復元 =====
  // （ファイルハンドルは localStorage には入れられないので IndexedDB を使う）
  const DB_NAME = "dndSlidesDB", STORE = "handles", KEY = "fileHandle";
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(handle) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(handle, KEY);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }
  async function idbGet() {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const r = tx.objectStore(STORE).get(KEY);
      r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
    });
  }

  // ---- 接続成功後の共通処理 ----
  function markConnected() {
    setStatus("ok", "接続済み：並べ替えるたびに自動保存されます");
    connectBtn.textContent = "✓ 接続済み（別ファイルに変更）";
  }

  // ---- ファイルに接続（ボタン） ----
  connectBtn.addEventListener("click", async () => {
    // 再接続モード：保存済みハンドルに権限を求めるだけ（ピッカーを出さない）
    if (connectBtn.dataset.reconnect === "1") {
      try {
        const saved = await idbGet();
        if (saved) {
          const perm = await saved.requestPermission({ mode: "readwrite" });
          if (perm === "granted") {
            fileHandle = saved;
            delete connectBtn.dataset.reconnect;
            markConnected();
            return;
          }
        }
      } catch { /* フォールスルーして通常ピッカーへ */ }
      delete connectBtn.dataset.reconnect;
    }
    try {
      [fileHandle] = await window.showOpenFilePicker({
        id: "dnd-slides",          // この id ごとに「前回開いた場所」を記憶
        startIn: "documents",      // 初回のデフォルト開始位置（書類フォルダ）
        types: [{ description: "HTML", accept: { "text/html": [".html"] } }],
      });
      const perm = await fileHandle.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") {
        setStatus("warn", "書き込み権限が許可されませんでした");
        fileHandle = null;
        return;
      }
      await idbSet(fileHandle);     // 次回のために保存
      markConnected();
    } catch (e) {
      if (e.name !== "AbortError") setStatus("warn", "接続できませんでした: " + e.message);
    }
  });

  // ---- 起動時：保存済みハンドルがあれば自動再接続を試みる ----
  async function tryAutoReconnect() {
    if (!supported) return;
    try {
      const saved = await idbGet();
      if (!saved) return;
      const perm = await saved.queryPermission({ mode: "readwrite" });
      if (perm === "granted") {
        fileHandle = saved;             // 権限が残っていれば即接続
        markConnected();
      } else {
        setStatus("warn", "前回のファイルを記憶中。ボタンを1度押すと再接続します");
        connectBtn.textContent = "🔄 前回のファイルに再接続";
        connectBtn.dataset.reconnect = "1";
      }
    } catch { /* 何もしない */ }
  }

  // クリックで表示切替
  toc.addEventListener("click", e => {
    const li = e.target.closest("li");
    if (li) showSlide(li);
  });

  // 目次項目をキーボードフォーカス可能にする（Enter で選択）
  [...toc.children].forEach(li => li.setAttribute("tabindex", "0"));
  toc.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const li = e.target.closest("li");
      if (li) { e.preventDefault(); showSlide(li); }
    }
  });

  // ---- キーボードでスライド移動 ----
  document.addEventListener("keydown", e => {
    // 入力中は無効（誤爆防止）
    const t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    switch (e.key) {
      case "ArrowRight": case "ArrowDown": case "PageDown":
      case "j": case "n":
        e.preventDefault(); move(1); break;
      case "ArrowLeft": case "ArrowUp": case "PageUp":
      case "k": case "p":
        e.preventDefault(); move(-1); break;
      case "Home":
        e.preventDefault(); goEdge(false); break;
      case "End":
        e.preventDefault(); goEdge(true); break;
      case " ":   // Space でサイドバー開閉
        e.preventDefault(); toggleSidebar(); break;
    }
  });

  // サイドバー開閉トグル（開閉状態は保存しない＝buildHtmlSnapshotで除外済み）
  const toggleBtn = document.getElementById("toggleBtn");
  function toggleSidebar() {
    const collapsed = document.body.classList.toggle("sidebar-collapsed");
    toggleBtn.textContent = collapsed ? "›" : "‹";  // 閉じたら「開く向き」を表示
  }
  toggleBtn.addEventListener("click", toggleSidebar);

  tryAutoReconnect();   // 起動時に前回のファイルへ自動再接続を試みる

  // SortableJS を有効化（目次のドラッグ並べ替え）
  Sortable.create(toc, {
    animation: 150,
    handle: ".handle",
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    dragClass: "sortable-drag",
    onEnd: () => {
      renumber();
      const active = toc.querySelector("li.active");
      if (active) showSlide(active);
      writeToFile();   // 並べ替えるたびにファイルへ即時保存
    },
  });

  renumber();
</script>
</body>
</html>
